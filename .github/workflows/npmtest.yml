# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: tests

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 22.x # EOL 2027-04-30
          - 24.x # EOL 2028-04-30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      # tsdown requires node ^22.18 || >=24.11, so the toolchain steps only run
      # on the newest node in the matrix. The tests run from source on every one.
      - run: npm run lint
        if: matrix.node-version == '24.x'
      - run: npm run typecheck
        if: matrix.node-version == '24.x'
      - run: npm run build --if-present
        if: matrix.node-version == '24.x'
      - run: npm test
        env:
          CI: true

  # engines.node is >=14, but the toolchain needs Node 22, so the package is
  # built on the newest Node and then loaded on each older Node it supports.
  compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 14.x
          - 16.x
          - 18.x
          - 20.x
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm install
      - run: npm run build
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: node test/compat/smoke.cjs
      - run: node test/compat/smoke.mjs
